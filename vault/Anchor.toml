[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
simple_vault = "5KDkgHuq5VRs3jJcVGkFqNZYNBAvymVFnn6tDdABEUwp"

[programs.localnet]
simple_vault = "5KDkgHuq5VRs3jJcVGkFqNZYNBAvymVFnn6tDdABEUwp"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
# порт 8000 на этой машине занят, поэтому свои порты
bind_address = "127.0.0.1"
gossip_port = 18000
dynamic_port_range = "18001-18100"
