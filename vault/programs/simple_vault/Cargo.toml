[package]
name = "simple_vault"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "simple_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
# Raydium CLMM для CPI (swap, позиции). Коммит d4ec101 — последняя версия на Anchor 0.31.1;
# feature devnet — ID программы Raydium в devnet (DRayAUgENGQBKVaX8owNhgzkEDyoHTGVEGHVJT1E9pfH)
raydium-amm-v3 = { git = "https://github.com/raydium-io/raydium-clmm", rev = "d4ec101534724a20e1eb38a9b997f8b391c5100f", features = ["cpi", "devnet"] }
# Pin versions to avoid incompatibility with Solana platform-tools rustc 1.79
blake3 = "=1.5.5"
constant_time_eq = "=0.3.1"
